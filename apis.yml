aid: ecosio

name: ecosio

description: 'ecosio (ecosio GmbH) provides automated B2B and B2G data exchange: managed EDI as a service, global e-invoicing and VAT compliance
  (Peppol and country clearance platforms), and supplier activation, delivered through its ecosio connect platform. Developers integrate via ecosio''s
  Messaging APIs and Management API documented at connect.ecosio.com. ecosio announced on its own blog that ecosio GmbH has been acquired by Vertex,
  the tax technology company.'

